function getCSTier(key, val){
  if(val===null||val===undefined) return 7;
  const tiers=CS_TIERS[key]||[];
  for(let i=0;i<tiers.length;i++){
    if(tiers[i][0]!==null && val>=tiers[i][0]) return i;
  }
  return 7;
}

function getCSTierPoints(key, val){
  const tierIdx=getCSTier(key,val);
  if(tierIdx===7) return 0;
  return CS_TIERS[key][tierIdx][1]||0;
}

function getRepBLS(repData){
  return CS_METRICS_KEYS.reduce((sum,key)=>{
    return sum + getCSTierPoints(key, repData[key]);

}

function getCSTierLabel(tierIdx){

function badge(val,key,monthIdx){
  monthIdx=monthIdx||0;
  if(val===undefined||val===null)return h('span',{style:{color:'#333',fontSize:12}},'—');
  const st=getStatusM(val,key,monthIdx);
  const c=C[st];
  const isC=key==='vhi'||key==='perks';
  const txt=isC?String(val):Number(val).toFixed(1)+'%';
  return h('span',{style:{background:c.bg,color:c.text,border:'1px solid '+c.border,borderRadius:6,padding:'2px 7px',fontSize:12,fontWeight:700,fontFamily:'monospace',display:'inline-block',minWidth:54,textAlign:'center'}},txt);
}

function ScoreDots({score,max}){
  max=max||12;
  return h('div',{style:{display:'flex',gap:2}},
    [...Array(max)].map((_,i)=>h('div',{key:i,style:{width:6,height:6,borderRadius:'50%',background:i<score?'#22c55e':'#1e1e1e',border:'1px solid '+(i<score?'#4ade80':'#333')}}))
  );
}

function Btn({label,active,onClick,col}){
  col=col||'#22c55e';
  return h('button',{onClick,style:{background:active?col+'22':'#0f0f0f',border:'1px solid '+(active?col:'#222'),borderRadius:6,color:active?col:'#555',padding:'5px 11px',fontSize:11,fontWeight:700,letterSpacing:1,cursor:'pointer',fontFamily:'inherit'}},label);
}

// ── Radar ─────────────────────────────────────────────────────────────────────
function normalize(val,key){
  const mx={vmp:100,premium:100,vhi:5,perks:30,smartquote:100,multi:100};
  return Math.max(0,Math.min(1.3,(val||0)/mx[key]));
}

function RadarChart({rep1,rep2,allReps}){
  const keys=KPI_KEYS;
  const n=keys.length;
  const cx=160,cy=160,r=110;
  const ang=keys.map((_,i)=>(Math.PI*2*i)/n-Math.PI/2);
  const pt=(norm,i)=>[cx+norm*r*Math.cos(ang[i]),cy+norm*r*Math.sin(ang[i])];
  const pts=rep=>keys.map((k,i)=>pt(normalize(rep[k]||0,k),i));
  const str=ps=>ps.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const r1=pts(rep1),r2=rep2?pts(rep2):null;
  const gPts=keys.map((k,i)=>pt(normalize(GOALS[k],k),i));
  const mPts=keys.map((k,i)=>pt(normalize(MINS[k],k),i));
  const rank=(rep,key)=>[...allReps].sort((a,b)=>(b[key]||0)-(a[key]||0)).findIndex(r=>r.name===rep.name)+1;

  return h('div',{style:{display:'flex',gap:20,flexWrap:'wrap',alignItems:'flex-start'}},
    h('svg',{width:320,height:320,style:{flexShrink:0}},
      [0.25,0.5,0.75,1].map(ring=>h('polygon',{key:ring,points:ang.map((a,i)=>((cx+ring*r*Math.cos(a)).toFixed(1)+','+(cy+ring*r*Math.sin(a)).toFixed(1))).join(' '),fill:'none',stroke:'#1e1e1e',strokeWidth:1})),
      ang.map((a,i)=>h('line',{key:i,x1:cx,y1:cy,x2:(cx+r*1.1*Math.cos(a)).toFixed(1),y2:(cy+r*1.1*Math.sin(a)).toFixed(1),stroke:'#222',strokeWidth:1})),
      h('polygon',{points:str(mPts),fill:'#f59e0b08',stroke:'#f59e0b',strokeWidth:1.5,strokeDasharray:'4,3'}),
      h('polygon',{points:str(gPts),fill:'#22c55e08',stroke:'#22c55e',strokeWidth:1.5,strokeDasharray:'4,3'}),
      r2&&h('polygon',{points:str(r2),fill:'#f472b620',stroke:'#f472b6',strokeWidth:2}),
      r2&&r2.map((p,i)=>h('circle',{key:i,cx:p[0].toFixed(1),cy:p[1].toFixed(1),r:4,fill:'#f472b6'})),
      h('polygon',{points:str(r1),fill:'#38bdf820',stroke:'#38bdf8',strokeWidth:2.5}),
      r1.map((p,i)=>h('circle',{key:i,cx:p[0].toFixed(1),cy:p[1].toFixed(1),r:5,fill:'#38bdf8'})),
      KPI_LABELS.map((lbl,i)=>h('text',{key:i,x:(cx+(r+22)*Math.cos(ang[i])).toFixed(1),y:(cy+(r+22)*Math.sin(ang[i])).toFixed(1),textAnchor:'middle',dominantBaseline:'middle',fill:'#888',fontSize:10,fontWeight:700},lbl)),
      h('circle',{cx,cy,r:3,fill:'#333'})
    ),
    h('div',{style:{flex:1,minWidth:180}},
      h('div',{style:{display:'flex',gap:14,marginBottom:12,flexWrap:'wrap'}},
        h('div',{style:{display:'flex',alignItems:'center',gap:6}},h('div',{style:{width:12,height:3,background:'#38bdf8'}}),h('span',{style:{fontSize:12,fontWeight:700,color:'#38bdf8'}},rep1.name)),
        rep2&&h('div',{style:{display:'flex',alignItems:'center',gap:6}},h('div',{style:{width:12,height:3,background:'#f472b6'}}),h('span',{style:{fontSize:12,fontWeight:700,color:'#f472b6'}},rep2.name))
      ),
      h('table',{style:{width:'100%',borderCollapse:'collapse'}},
        h('thead',null,h('tr',null,
          h('th',{style:{fontSize:10,color:'#444',textAlign:'left',padding:'3px 6px',letterSpacing:1}},'KPI'),
          h('th',{style:{fontSize:10,color:'#38bdf8',textAlign:'center',padding:'3px 6px'}},rep1.name.split(' ')[0].toUpperCase()),
          rep2&&h('th',{style:{fontSize:10,color:'#f472b6',textAlign:'center',padding:'3px 6px'}},rep2.name.split(' ')[0].toUpperCase()),
          h('th',{style:{fontSize:10,color:'#444',textAlign:'center',padding:'3px 6px'}},'GOAL')
        )),
        h('tbody',null,keys.map((k,i)=>{
          const isC=k==='vhi'||k==='perks';
          const fv=v=>v===undefined||v===null?'—':isC?v:Number(v).toFixed(1)+'%';
          const s1=getStatus(rep1[k]||0,GOALS[k],MINS[k]);
          const s2=rep2?getStatus(rep2[k]||0,GOALS[k],MINS[k]):null;
          return h('tr',{key:k,style:{borderBottom:'1px solid #141414'}},
            h('td',{style:{padding:'6px',fontSize:11,color:'#666',fontWeight:700}},KPI_LABELS[i]),
            h('td',{style:{padding:'6px',textAlign:'center'}},
              h('span',{style:{color:C[s1].text,fontWeight:700,fontSize:12}},fv(rep1[k])),
              h('div',{style:{fontSize:9,color:'#444',marginTop:1}},'#'+rank(rep1,k)+' / '+allReps.length)
            ),
            rep2&&h('td',{style:{padding:'6px',textAlign:'center'}},
              h('span',{style:{color:C[s2].text,fontWeight:700,fontSize:12}},fv(rep2[k])),
              h('div',{style:{fontSize:9,color:'#444',marginTop:1}},'#'+rank(rep2,k)+' / '+allReps.length)
            ),
            h('td',{style:{padding:'6px',textAlign:'center',fontSize:11,color:'#333'}},fv(GOALS[k]))
          );
        }))
      )
    )
  );
}

// ── Trend Chart ───────────────────────────────────────────────────────────────
function TrendChart({rep1,rep2,allMonths,selKPI,onSelKPI}){
  const isC=selKPI==='vhi'||selKPI==='perks';
  const fv=v=>isC?Number(v).toFixed(1):Number(v).toFixed(1)+'%';
  const getPts=rep=>allMonths.map(m=>{
    const f=m.data.find(d=>d.name.toLowerCase()===rep.name.toLowerCase());
    const val=f?f[selKPI]:null;
    return{month:m.label,value:(val!==undefined&&val!==null&&val>-50)?val:null};
  }).filter(p=>p.value!==null);

  const p1=getPts(rep1),p2=rep2?getPts(rep2):[];
  if(p1.length<1)return h('div',{style:{color:'#333',fontSize:12,padding:'10px 0'}},'No data available for this KPI.');

  const allV=[...p1.map(p=>p.value),...p2.map(p=>p.value)];
  const lo=Math.min(...allV,MINS[selKPI])*0.85;
  const hi=Math.max(...allV,GOALS[selKPI])*1.1;
  const rng=hi-lo||1;
  const W=420,H=160,PL=8,PR=40,PT=16,PB=30;
  const cW=W-PL-PR,cH=H-PT-PB;
  const xp=(i,tot)=>tot<2?PL+cW/2:PL+(i/(tot-1))*cW;
  const yp=v=>PT+cH-((v-lo)/rng)*cH;
  const gY=yp(GOALS[selKPI]),mY=yp(MINS[selKPI]);
  const mkPath=pts=>pts.map((p,i)=>(i===0?'M':'L')+xp(i,pts.length).toFixed(1)+','+yp(p.value).toFixed(1)).join(' ');

  return h('div',{style:{marginTop:18}},
    h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8,flexWrap:'wrap',gap:6}},
      h('div',{style:{display:'flex',gap:12,alignItems:'center',flexWrap:'wrap'}},
        h('span',{style:{fontSize:11,fontWeight:900,color:'#aaa',letterSpacing:1}},'TREND'),
        h('div',{style:{display:'flex',alignItems:'center',gap:5}},h('div',{style:{width:14,height:3,background:'#38bdf8'}}),h('span',{style:{fontSize:10,color:'#38bdf8',fontWeight:700}},rep1.name.split(' ')[0])),
        rep2&&h('div',{style:{display:'flex',alignItems:'center',gap:5}},h('div',{style:{width:14,height:3,background:'#f472b6'}}),h('span',{style:{fontSize:10,color:'#f472b6',fontWeight:700}},rep2.name.split(' ')[0]))
      ),
      h('div',{style:{display:'flex',gap:5,flexWrap:'wrap'}},
        KPI_KEYS.map((k,i)=>h('button',{key:k,onClick:()=>onSelKPI(k),style:{background:selKPI===k?'#22c55e22':'#0f0f0f',border:'1px solid '+(selKPI===k?'#22c55e':'#222'),borderRadius:4,color:selKPI===k?'#22c55e':'#555',padding:'3px 8px',cursor:'pointer',fontSize:10,fontWeight:700,fontFamily:'inherit'}},KPI_LABELS[i]))
      )
    ),
    h('div',{style:{overflowX:'auto'}},
      h('svg',{width:W,height:H,style:{display:'block'}},
        GOALS[selKPI]>=lo&&h('line',{x1:PL,y1:gY.toFixed(1),x2:W-PR,y2:gY.toFixed(1),stroke:'#22c55e',strokeWidth:1,strokeDasharray:'4,3'}),
        GOALS[selKPI]>=lo&&h('text',{x:W-PR+3,y:gY.toFixed(1),fill:'#22c55e',fontSize:8,dominantBaseline:'middle'},'GOAL'),
        MINS[selKPI]>=lo&&h('line',{x1:PL,y1:mY.toFixed(1),x2:W-PR,y2:mY.toFixed(1),stroke:'#f59e0b',strokeWidth:1,strokeDasharray:'4,3'}),
        MINS[selKPI]>=lo&&h('text',{x:W-PR+3,y:mY.toFixed(1),fill:'#f59e0b',fontSize:8,dominantBaseline:'middle'},'MIN'),
        p2.length>0&&h('path',{d:mkPath(p2),fill:'none',stroke:'#f472b6',strokeWidth:2,strokeDasharray:'5,3'}),
        p2.map((p,i)=>h('g',{key:i},
          h('circle',{cx:xp(i,p2.length).toFixed(1),cy:yp(p.value).toFixed(1),r:4,fill:'#f472b6',stroke:'#080808',strokeWidth:1.5}),
          h('text',{x:xp(i,p2.length).toFixed(1),y:(yp(p.value)+13).toFixed(1),textAnchor:'middle',fill:'#f472b6',fontSize:8,fontWeight:700},fv(p.value))
        )),
        p1.length>1&&h('path',{d:mkPath(p1),fill:'none',stroke:'#38bdf8',strokeWidth:2.5}),
        p1.length>1&&h('path',{d:mkPath(p1)+' L'+xp(p1.length-1,p1.length).toFixed(1)+','+(PT+cH)+' L'+PL+','+(PT+cH)+' Z',fill:'#38bdf808'}),
        p1.map((p,i)=>{
          const st=getStatus(p.value,GOALS[selKPI],MINS[selKPI]);
          const col=C[st].border;
          const cx2=xp(i,p1.length),cy2=yp(p.value);
          return h('g',{key:i},
            h('circle',{cx:cx2.toFixed(1),cy:cy2.toFixed(1),r:5,fill:col,stroke:'#080808',strokeWidth:1.5}),
            h('text',{x:cx2.toFixed(1),y:(cy2-10).toFixed(1),textAnchor:'middle',fill:col,fontSize:9,fontWeight:700},fv(p.value)),
            h('text',{x:cx2.toFixed(1),y:(PT+cH+14).toFixed(1),textAnchor:'middle',fill:'#444',fontSize:8},p.month.replace(' 2026',''))
          );
        })
      )
    )
  );
}

function getRepsByDay(dayOfWeek){
  const result={};
  Object.entries(STORES).forEach(([store,info])=>{
    const reps=(info.schedule[dayOfWeek]||[]).map(fullName);
    if(reps.length)result[store]={color:info.color,reps};
  });
  return result;
}

function CalendarTab({scored,allMonths,activeMo}){
  const [selCalRep,setSelCalRep]=useState(null);
  const [selDay,setSelDay]=useState(null);
  const [calMonth,setCalMonth]=useState(4);
  const [calYear,setCalYear]=useState(2026);
  const [kpiIndex,setKpiIndex]=useState(0);
  const [touchStartX,setTouchStartX]=useState(null);

  const MONTH_NAMES=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const today=new Date(2026,4,22);
  const firstDay=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const cells=[];
  for(let i=0;i<firstDay;i++)cells.push(null);
  for(let d=1;d<=daysInMonth;d++)cells.push(d);
  while(cells.length%7!==0)cells.push(null);
  const weeks=[];
  for(let i=0;i<cells.length;i+=7)weeks.push(cells.slice(i,i+7));

  function repMetrics(name){
    const mo=allMonths[activeMo];
    if(!mo)return null;
    return mo.data.find(r=>r.name.toLowerCase()===name.toLowerCase());
  }

  const activeKPIs=KPI_KEYS.filter(k=>k!=='multi'||(activeMo===4));

  // Swipe handlers for KPI carousel
  function onTouchStart(e){setTouchStartX(e.touches[0].clientX);}
  function onTouchEnd(e){
    if(touchStartX===null)return;
    const diff=touchStartX-e.changedTouches[0].clientX;
    if(Math.abs(diff)>40){
      if(diff>0)setKpiIndex(i=>Math.min(i+1,activeKPIs.length-1));
      else setKpiIndex(i=>Math.max(i-1,0));
    }
    setTouchStartX(null);
  }

  const metricPanel=selCalRep&&(()=>{
    const rep=repMetrics(selCalRep);
    const sc=scored.find(r=>r.name.toLowerCase()===selCalRep.toLowerCase());
    const k=activeKPIs[kpiIndex];
    const val=rep?rep[k]:null;
    const isC=k==='vhi'||k==='perks';
    const st=val!==null&&val!==undefined?getStatus(val,GOALS[k],MINS[k]):'below';
    const c=C[st];
    const rankNum=sc?[...scored].sort((a,b)=>(b[k]||0)-(a[k]||0)).findIndex(r=>r.name===sc.name)+1:null;

    return h('div',{style:{background:'#080f18',border:'1px solid #38bdf844',borderRadius:12,padding:16,marginBottom:14}},
      // Header
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:14}},
        h('div',null,
          h('div',{style:{fontSize:16,fontWeight:900,color:'#38bdf8'}},selCalRep),
          h('div',{style:{fontSize:10,color:'#444',marginTop:2,letterSpacing:1}},allMonths[activeMo]?.label+' METRICS')
        ),
        h('button',{onClick:()=>setSelCalRep(null),style:{background:'#0f0f0f',border:'1px solid #222',borderRadius:6,color:'#555',padding:'6px 12px',cursor:'pointer',fontSize:11,fontFamily:'inherit'}},'✕')
      ),

      rep?h(Fragment,null,
        // KPI Dots nav
        h('div',{style:{display:'flex',justifyContent:'center',gap:6,marginBottom:12}},
          activeKPIs.map((k2,i)=>{
            const v2=rep[k2];
            const s2=v2!==null&&v2!==undefined?getStatus(v2,GOALS[k2],MINS[k2]):'below';
            return h('button',{key:k2,onClick:()=>setKpiIndex(i),style:{width:i===kpiIndex?24:8,height:8,borderRadius:4,background:i===kpiIndex?C[s2].border:'#222',border:'none',cursor:'pointer',transition:'width 0.2s',padding:0}});
          })
        ),

        // KPI Card - swipeable
        h('div',{onTouchStart,onTouchEnd,style:{touchAction:'pan-y',userSelect:'none'}},
          h('div',{style:{background:c.bg,border:'1px solid '+c.border,borderRadius:12,padding:'20px 16px',textAlign:'center',marginBottom:12}},
            h('div',{style:{fontSize:11,color:c.text,letterSpacing:2,marginBottom:8,opacity:0.8}},KPI_LABELS[KPI_KEYS.indexOf(k)]),
            h('div',{style:{fontSize:42,fontWeight:900,color:c.text,lineHeight:1}},
              val!==null&&val!==undefined?(isC?val:Number(val).toFixed(1)+'%'):'—'
            ),
            h('div',{style:{display:'flex',justifyContent:'center',gap:20,marginTop:10}},
              h('div',{style:{textAlign:'center'}},
                h('div',{style:{fontSize:9,color:c.text,opacity:0.6,letterSpacing:1}},'GOAL'),
                h('div',{style:{fontSize:13,fontWeight:700,color:c.text}},(isC?GOALS[k]:GOALS[k]+'%'))
              ),
              h('div',{style:{textAlign:'center'}},
                h('div',{style:{fontSize:9,color:c.text,opacity:0.6,letterSpacing:1}},'MIN'),
                h('div',{style:{fontSize:13,fontWeight:700,color:c.text}},(isC?MINS[k]:MINS[k]+'%'))
              ),
              rankNum&&h('div',{style:{textAlign:'center'}},
                h('div',{style:{fontSize:9,color:c.text,opacity:0.6,letterSpacing:1}},'RANK'),
                h('div',{style:{fontSize:13,fontWeight:700,color:c.text}},'#'+rankNum+' / '+scored.length)
              )
            )
          )
        ),

        // Arrow nav
        h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}},
          h('button',{onClick:()=>setKpiIndex(i=>Math.max(i-1,0)),disabled:kpiIndex===0,style:{background:kpiIndex===0?'transparent':'#0f0f0f',border:'1px solid '+(kpiIndex===0?'transparent':'#333'),borderRadius:6,color:kpiIndex===0?'#222':'#aaa',padding:'8px 16px',cursor:kpiIndex===0?'default':'pointer',fontSize:13,fontFamily:'inherit'}},'◀'),
          h('div',{style:{fontSize:10,color:'#444',letterSpacing:1}},
            (kpiIndex+1)+' / '+activeKPIs.length+' · SWIPE TO NAVIGATE'
          ),
          h('button',{onClick:()=>setKpiIndex(i=>Math.min(i+1,activeKPIs.length-1)),disabled:kpiIndex===activeKPIs.length-1,style:{background:kpiIndex===activeKPIs.length-1?'transparent':'#0f0f0f',border:'1px solid '+(kpiIndex===activeKPIs.length-1?'transparent':'#333'),borderRadius:6,color:kpiIndex===activeKPIs.length-1?'#222':'#aaa',padding:'8px 16px',cursor:kpiIndex===activeKPIs.length-1?'default':'pointer',fontSize:13,fontFamily:'inherit'}},'▶')
        ),

        // Mini grid of all KPIs
        h('div',{style:{display:'flex',gap:6,flexWrap:'wrap',marginTop:10}},
          activeKPIs.map((k2,i)=>{
            const v2=rep[k2];
            if(v2===null||v2===undefined)return null;
            const s2=getStatus(v2,GOALS[k2],MINS[k2]);
            const isC2=k2==='vhi'||k2==='perks';
            return h('div',{key:k2,onClick:()=>setKpiIndex(i),style:{flex:'1 1 calc(33% - 6px)',background:C[s2].bg,border:'2px solid '+(i===kpiIndex?C[s2].border:C[s2].border+'44'),borderRadius:8,padding:'6px 8px',textAlign:'center',cursor:'pointer',minWidth:60}},
              h('div',{style:{fontSize:8,color:C[s2].text,opacity:0.7,letterSpacing:1,marginBottom:2}},KPI_LABELS[KPI_KEYS.indexOf(k2)]),
              h('div',{style:{fontSize:13,fontWeight:900,color:C[s2].text}},isC2?v2:Number(v2).toFixed(1)+'%')
            );
          })
        )
      ):h('div',{style:{color:'#444',fontSize:13,textAlign:'center',padding:20}},'No data for '+allMonths[activeMo]?.label+'.')
    );
  })();

  // Day detail panel
  const dayPanel=selDay&&!selCalRep&&(()=>{
    const dow=(new Date(calYear,calMonth,selDay).getDay());
    const storeData=getRepsByDay(dow);
    return h('div',{style:{background:'#0c0c0c',border:'1px solid #1a1a1a',borderRadius:12,padding:14,marginBottom:14}},
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}},
        h('div',{style:{fontSize:14,fontWeight:900,color:'#fff'}},MONTH_NAMES[calMonth]+' '+selDay),
        h('button',{onClick:()=>setSelDay(null),style:{background:'#0f0f0f',border:'1px solid #222',borderRadius:6,color:'#555',padding:'6px 12px',cursor:'pointer',fontSize:11,fontFamily:'inherit'}},'✕')
      ),
      h('div',{style:{display:'flex',flexDirection:'column',gap:10}},
        Object.entries(storeData).map(([store,{color,reps}])=>
          h('div',{key:store,style:{background:color+'10',border:'1px solid '+color+'33',borderRadius:8,padding:10}},
            h('div',{style:{fontSize:10,fontWeight:900,color,letterSpacing:1,marginBottom:8}},store.toUpperCase()+' — '+reps.length+' REPS'),
            h('div',{style:{display:'flex',flexWrap:'wrap',gap:6}},
              reps.map(rep=>{
                const hasData=!!repMetrics(rep);
                return h('button',{key:rep,onClick:()=>{setSelCalRep(rep);setKpiIndex(0);},style:{background:hasData?color+'22':'#111',border:'1px solid '+(hasData?color:'#333'),borderRadius:6,color:hasData?color:'#555',padding:'6px 10px',cursor:'pointer',fontSize:11,fontWeight:700,fontFamily:'inherit'}},rep.split(' ')[0]);
              })
            )
          )
        )
      )
    );
  })();

  return h('div',null,
    // Month nav
    h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14,flexWrap:'wrap',gap:10}},
      h('div',{style:{display:'flex',gap:8,alignItems:'center'}},
        h('button',{onClick:()=>{if(calMonth===0){setCalMonth(11);setCalYear(y=>y-1);}else setCalMonth(m=>m-1);},style:{background:'#0f0f0f',border:'1px solid #222',borderRadius:8,color:'#aaa',padding:'8px 16px',cursor:'pointer',fontFamily:'inherit',fontSize:16}},'◀'),
        h('span',{style:{fontSize:15,fontWeight:900,color:'#fff',minWidth:140,textAlign:'center'}},MONTH_NAMES[calMonth]+' '+calYear),
        h('button',{onClick:()=>{if(calMonth===11){setCalMonth(0);setCalYear(y=>y+1);}else setCalMonth(m=>m+1);},style:{background:'#0f0f0f',border:'1px solid #222',borderRadius:8,color:'#aaa',padding:'8px 16px',cursor:'pointer',fontFamily:'inherit',fontSize:16}},'▶')
      ),
      h('div',{style:{display:'flex',gap:8,flexWrap:'wrap'}},
        Object.entries(STORES).map(([name,info])=>
          h('div',{key:name,style:{display:'flex',alignItems:'center',gap:4}},
            h('div',{style:{width:8,height:8,borderRadius:2,background:info.color}}),
            h('span',{style:{fontSize:9,color:info.color,fontWeight:700,letterSpacing:1}},info.short)
          )
        )
      )
    ),

    metricPanel,
    dayPanel,

    // Calendar grid
    h('div',{style:{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2}},
      ['S','M','T','W','T','F','S'].map((d,i)=>
        h('div',{key:i,style:{textAlign:'center',fontSize:10,color:'#444',padding:'4px 0',letterSpacing:1}},d)
      ),
      cells.map((day,idx)=>{
        if(!day)return h('div',{key:'e'+idx,style:{minHeight:70,background:'#050505',borderRadius:6}});
        const dow=idx%7;
        const isToday=day===today.getDate()&&calMonth===today.getMonth()&&calYear===today.getFullYear();
        const isSel=selDay===day&&!selCalRep;
        const storeData=getRepsByDay(dow);
        const totalReps=Object.values(storeData).reduce((a,{reps})=>a+reps.length,0);
        return h('div',{key:day,onClick:()=>{setSelDay(isSel?null:day);setSelCalRep(null);},style:{minHeight:70,background:isToday?'#0a1f0a':isSel?'#0a1020':'#0d0d0d',border:'2px solid '+(isToday?'#22c55e':isSel?'#38bdf8':'transparent'),borderRadius:8,padding:'4px 4px',cursor:'pointer',position:'relative',overflow:'hidden'}},
          h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:4}},
            h('span',{style:{fontSize:13,fontWeight:900,color:isToday?'#22c55e':isSel?'#38bdf8':'#666'}},day),
            totalReps>0&&h('span',{style:{fontSize:8,color:'#444',fontWeight:700}},totalReps)
          ),
          h('div',{style:{display:'flex',flexDirection:'column',gap:2}},
            Object.entries(storeData).map(([store,{color,reps}])=>
              h('div',{key:store,style:{background:color+'22',borderRadius:3,padding:'1px 3px',display:'flex',alignItems:'center',gap:2}},
                h('div',{style:{width:4,height:4,borderRadius:'50%',background:color,flexShrink:0}}),
                h('span',{style:{fontSize:7,color,fontWeight:700,overflow:'hidden',whiteSpace:'nowrap',textOverflow:'ellipsis'}},reps.map(r=>r.split(' ')[0]).join(', '))
              )
            )
          )
        );
      })
    )
  );
}

function Dashboard(){
  const [tab,setTab]=useState('leaderboard');
  const [sortKey,setSortKey]=useState('score');
  const [filterStatus,setFilterStatus]=useState('all');
  const [search,setSearch]=useState('');
  const [selRep,setSelRep]=useState(null);
  const [cmpRep,setCmpRep]=useState(null);
  const [cmpSearch,setCmpSearch]=useState('');
  const [trendKPI,setTrendKPI]=useState('vmp');
  const [months,setMonths]=useState(ALL_MONTHS);
  const [activeMo,setActiveMo]=useState(4);
  const [newData,setNewData]=useState({name:'',vmp:'',premium:'',vhi:'',perks:'',smartquote:'',multi:''});
  const [addMsg,setAddMsg]=useState('');

  const currentData=months[activeMo].data;
  const isMay=activeMo===4;

  const scored=useMemo(()=>currentData.map(r=>({...r,score:scoreRep(r)})),[currentData]);

  const filtered=useMemo(()=>{
    let d=[...scored];
    if(search)d=d.filter(r=>r.name.toLowerCase().includes(search.toLowerCase()));
    if(filterStatus==='goal')d=d.filter(r=>r.score>=10);
    if(filterStatus==='mid')d=d.filter(r=>r.score>=5&&r.score<10);
    if(filterStatus==='below')d=d.filter(r=>r.score<5);
    if(sortKey==='score')d.sort((a,b)=>b.score-a.score);
    else d.sort((a,b)=>(b[sortKey]||0)-(a[sortKey]||0));
    return d;
  },[scored,search,filterStatus,sortKey]);

  const stats=useMemo(()=>{
    if(sortKey==='score'){
      return{
        atGoal:scored.filter(r=>r.score>=10).length,
        atMin:scored.filter(r=>r.score>=5&&r.score<10).length,
        below:scored.filter(r=>r.score<5).length,
        label:['AT / ABOVE GOAL','BETWEEN','BELOW MIN'],
      };
    }
    const goal=GOALS[sortKey], min=MINS[sortKey];
    const isC=sortKey==='vhi'||sortKey==='perks';
    const LBLMAP={vmp:'VMP%',premium:activeMo===0?'HPU':'Premium%',vhi:'VHI',perks:'Perks',smartquote:'SmartQ%',multi:'Multi%'};
    const lbl=LBLMAP[sortKey]||sortKey;
    const fv=v=>isC?v:(Number(v).toFixed(1)+'%');
    return{
      atGoal:scored.filter(r=>(r[sortKey]||0)>=goal).length,
      atMin:scored.filter(r=>(r[sortKey]||0)>=min&&(r[sortKey]||0)<goal).length,
      below:scored.filter(r=>(r[sortKey]||0)<min).length,
      label:[
        lbl+' ≥ '+fv(goal),
        fv(min)+' – '+fv(goal),
        lbl+' < '+fv(min),
      ],
    };
  },[scored,sortKey]);

  const kpiAvg=useMemo(()=>KPI_KEYS.map(k=>{
    const v=currentData.map(r=>r[k]).filter(v=>v!==undefined&&v!==null&&v>-50);
    if(!v.length)return null;
    return(v.reduce((a,b)=>a+b,0)/v.length);
  }),[currentData]);

  const cmpOptions=useMemo(()=>{
    if(!selRep)return[];
    return scored.filter(r=>r.name!==selRep.name&&(!cmpSearch||r.name.toLowerCase().includes(cmpSearch.toLowerCase())));
  },[scored,selRep,cmpSearch]);

  function addRep(){
    const{name,vmp,premium,vhi,perks,smartquote,multi}=newData;
    if(!name){setAddMsg('Name required.');return;}
    const rep={name,vmp:+vmp,premium:+premium,vhi:+vhi,perks:+perks,smartquote:+smartquote,multi:multi!==''?+multi:undefined};
    setMonths(prev=>prev.map((m,i)=>i===activeMo?{...m,data:[...m.data,rep]}:m));
    setNewData({name:'',vmp:'',premium:'',vhi:'',perks:'',smartquote:'',multi:''});
    setAddMsg('Added '+name);
    setTimeout(()=>setAddMsg(''),3000);
  }

  function addMonth(){
    const label=prompt('Month label (e.g. June 2026):');
    if(!label)return;
    setMonths(prev=>[...prev,{label,data:[]}]);
    setActiveMo(months.length);
  }

  const thS={textAlign:'left',padding:'8px 10px',fontSize:10,color:'#444',letterSpacing:1,borderBottom:'1px solid #141414',textTransform:'uppercase',cursor:'pointer'};
  const tdS={padding:'8px 10px',fontSize:12};
  const trS=(i,sel)=>({background:sel?'#0a1f0a':i%2===0?'#0c0c0c':'#0f0f0f',borderBottom:'1px solid #141414',cursor:'pointer'});
  const stickyTh={...thS,position:'sticky',left:0,zIndex:2,background:'#0a0a0a'};
  const stickyTd=(sel,i)=>({...tdS,position:'sticky',left:0,zIndex:1,background:sel?'#0a1f0a':i%2===0?'#0c0c0c':'#0f0f0f',fontWeight:700});

  const kpiCols=KPI_KEYS.map((k,i)=>({key:k,label:KPI_LABELS[i],isCount:k==='vhi'||k==='perks'}));
  const visKPIs=kpiCols;
  const focusKPI=sortKey!=='score'?visKPIs.find(c=>c.key===sortKey):null;
  const visCols=focusKPI?[focusKPI]:visKPIs;

  // HEADER
  const header=h('div',{style:{background:'linear-gradient(135deg,#0a0f1a,#080808)',borderBottom:'1px solid #1a2a3a',padding:'20px 22px 14px'}},
    h('div',{style:{display:'flex',justifyContent:'space-between',flexWrap:'wrap',gap:10,marginBottom:14}},
      h('div',null,
        h('div',{style:{display:'flex',alignItems:'center',gap:10}},
          h('div',{style:{width:10,height:10,borderRadius:'50%',background:'#38bdf8'}}),
          h('h1',{style:{fontSize:20,fontWeight:900,color:'#fff',margin:0}},"BLAKE'S AREA — KPI DASHBOARD")
        ),
        h('div',{style:{color:'#444',fontSize:10,marginTop:4,letterSpacing:2}},'MINIMUM STANDARDS · PERFORMANCE TRACKING · '+scored.length+' REPS')
      ),
      h('div',{style:{display:'flex',gap:6,flexWrap:'wrap'}},
        months.map((m,i)=>h('button',{key:i,onClick:()=>setActiveMo(i),style:{background:i===activeMo?'#38bdf822':'#0f0f0f',border:'1px solid '+(i===activeMo?'#38bdf8':'#222'),borderRadius:6,color:i===activeMo?'#38bdf8':'#555',padding:'6px 12px',cursor:'pointer',fontSize:11,fontWeight:700,fontFamily:'inherit',letterSpacing:1}},m.label)),
        h('button',{onClick:addMonth,style:{background:'#0f0f0f',border:'1px solid #222',borderRadius:6,color:'#60a5fa',padding:'6px 12px',cursor:'pointer',fontSize:11,fontWeight:700,fontFamily:'inherit',letterSpacing:1}},'+ NEW')
      )
    ),
    h('div',{style:{overflowX:'auto'}},
      h('table',{style:{borderCollapse:'collapse'}},
        h('thead',null,h('tr',null,
          h('th',{style:{fontSize:9,color:'#444',letterSpacing:1,padding:'3px 14px 3px 0',textAlign:'left'}},'AVG'),
          visKPIs.map(c=>h('th',{key:c.key,style:{fontSize:9,color:'#444',letterSpacing:1,padding:'3px 14px',textAlign:'center'}},c.label))
        )),
        h('tbody',null,
          h('tr',null,
            h('td',{style:{fontSize:10,color:'#38bdf8',fontWeight:900,padding:'4px 14px 4px 0'}},'TEAM'),
            visKPIs.map((c,i)=>{
              const idx=KPI_KEYS.indexOf(c.key);
              const val=kpiAvg[idx];

          ),
          h('tr',{style:{background:'#06080f'}},
            h('th',{style:{padding:'4px 10px',position:'sticky',left:0,background:'#06080f',borderRight:'1px solid #1a1a1a',borderBottom:'1px solid #1a1a1a'}},
              h('span',{style:{fontSize:8,color:'#333',letterSpacing:1}},'TIER →')
            ),
            CS_METRICS.map(({key})=>h('th',{key,style:{padding:'3px 4px',borderBottom:'1px solid #1a1a1a'}},
              h('div',{style:{display:'flex',gap:2,justifyContent:'center'}},
                CS_TIER_COLORS.slice(0,7).map((c,i)=>h('div',{key:i,title:getCSTierLabel(i),style:{width:10,height:10,borderRadius:2,background:c[1],opacity:0.8}}))
              )
            )),
            h('th',{style:{padding:'4px 10px',borderBottom:'1px solid #1a1a1a',position:'sticky',right:0,background:'#06080f',borderLeft:'1px solid #1a1a1a'}},
              h('span',{style:{fontSize:8,color:'#f59e0b',letterSpacing:1}},'POINTS')
            )
          ),
          h('tr',{style:{background:'#080f18'}},
            h('th',{style:{textAlign:'left',padding:'5px 10px',fontSize:9,color:'#38bdf8',letterSpacing:1,borderBottom:'1px solid #1a1a1a',position:'sticky',left:0,zIndex:2,background:'#080f18',borderRight:'1px solid #1a1a1a'}},'AREA TOTAL'),
            CS_METRICS.map(({key})=>h('th',{key,style:{textAlign:'center',padding:'5px 8px',fontSize:10,color:'#38bdf8',fontWeight:700,borderBottom:'1px solid #1a1a1a'}},
              csTotals[key]!=null?(Number.isInteger(csTotals[key])?csTotals[key]:csTotals[key].toFixed(1)):'—'
            ))
          )
        ),
        h('tbody',null,csReps.map((rep,i)=>{
          const bg=i%2===0?'#0c0c0c':'#0f0f0f';
          return h('tr',{key:rep.name,style:{background:bg,borderBottom:'1px solid #141414'}},
            h('td',{style:{padding:'8px 10px',fontSize:12,fontWeight:700,color:'#e5e5e5',position:'sticky',left:0,zIndex:1,background:bg,minWidth:140,borderRight:'1px solid #1a1a1a',whiteSpace:'nowrap'}},rep.name),
            CS_METRICS.map(({key})=>{
              const val=rep[key];
              const tierIdx=getCSTier(key,val);
              const tierCol=CS_TIER_COLORS[Math.min(tierIdx,7)]||CS_TIER_COLORS[7];
              const tierLbl=getCSTierLabel(tierIdx);
              const isActive=key===csSortKey;
              return h('td',{key,style:{padding:'6px 6px',textAlign:'center'}},
                val!=null?h('div',{style:{background:tierCol[0],border:'1px solid '+tierCol[1]+(isActive?'':'88'),borderRadius:6,padding:'3px 6px',display:'inline-block',minWidth:44}},
                  h('div',{style:{color:tierCol[2],fontWeight:900,fontSize:12,lineHeight:1.2}},Number.isInteger(val)?val:val.toFixed(1)),
                  h('div',{style:{color:tierCol[2],fontSize:8,opacity:0.8,letterSpacing:1}},tierLbl)
                ):h('span',{style:{color:'#333',fontSize:11}},'—')
              );
            }),
            (()=>{
              const bls=getRepBLS(rep);
              const lvl=getBLSLevel(bls);
              return h('td',{style:{padding:'6px 8px',textAlign:'center',position:'sticky',right:0,background:bg,borderLeft:'1px solid #1a1a1a'}},
                h('div',{style:{background:lvl.bg,border:'2px solid '+lvl.color,borderRadius:8,padding:'4px 8px',minWidth:80}},
                  h('div',{style:{color:lvl.color,fontWeight:900,fontSize:13}},(bls||0).toLocaleString()),
                  h('div',{style:{color:lvl.color,fontSize:9,opacity:0.9,letterSpacing:1}},lvl.label+' · '+lvl.bonus)
                )
              );
            })()
          );
        }))
      )
    ),

    // Add data section
    h('div',{style:{background:'#0f0f0f',border:'1px solid #1a1a1a',borderRadius:10,padding:14}},
      h('div',{style:{fontSize:11,fontWeight:900,color:'#fff',marginBottom:10,letterSpacing:1}},'ADD / UPDATE '+CSCORE_SHORT_MAP[csMonth]+' DATA'),
      h('div',{style:{fontSize:10,color:'#444',marginBottom:12}},'Select a metric and enter values for each rep'),
      h('div',{style:{display:'flex',gap:6,flexWrap:'wrap',marginBottom:10}},
        CS_METRICS.map(({key,short})=>h('button',{key,onClick:()=>setCsSortKey(key),style:{background:key===csSortKey?'#38bdf822':'#111',border:'1px solid '+(key===csSortKey?'#38bdf8':'#222'),borderRadius:5,color:key===csSortKey?'#38bdf8':'#555',padding:'4px 8px',cursor:'pointer',fontSize:10,fontFamily:'inherit'}},short))
      ),
      h('div',{style:{display:'grid',gap:6,maxHeight:300,overflowY:'auto'}},
        BLAKE_REPS.map(name=>{
          const cur=csCurrentData[name]?.[csSortKey];
          const inputVal=csInput[csSortKey]?.[name]??'';
          return h('div',{key:name,style:{display:'flex',gap:8,alignItems:'center'}},
            h('div',{style:{fontSize:11,color:'#aaa',minWidth:160,flexShrink:0}},name),
            h('div',{style:{fontSize:10,color:'#444',minWidth:40}},cur!=null?'cur: '+cur:'—'),
            h('input',{type:'number',placeholder:'new value',value:inputVal,
              onChange:e=>{
                const v=e.target.value;
                setCsInput(p=>({...p,[csSortKey]:{...(p[csSortKey]||{}),[name]:v}}));
              },
              style:{background:'#080808',border:'1px solid #222',borderRadius:5,color:'#fff',padding:'4px 8px',fontSize:11,fontFamily:'inherit',outline:'none',width:90,textAlign:'center'}
            })
          );
        })
      ),
      h('button',{onClick:saveCSData,style:{background:'#38bdf822',border:'1px solid #38bdf8',borderRadius:7,color:'#38bdf8',padding:'10px',fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit',width:'100%',marginTop:12}},'SAVE '+CSCORE_SHORT_MAP[csMonth]+' DATA')
    )
  );

  return h('div',{style:{background:'#080808',minHeight:'100vh',fontFamily:"'Courier New',monospace",color:'#e5e5e5'}},
    header,tabBar,
    h('div',{style:{padding:'18px 22px'}},
      tab==='leaderboard'&&leaderboard,
      tab==='leaderboard'&&compareTab,
      tab==='compare'&&compareTab,
      tab==='trends'&&trendsTab,
      tab==='add-data'&&addTab,
      tab==='multi-ytd'&&multiYtdTab,
      tab==='cscore'&&cScoreTab,
      tab==='schedule'&&h(CalendarTab,{scored,allMonths:months,activeMo})
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(Dashboard,null));
</script>
</body>
</html>
