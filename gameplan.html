<meta charset="UTF-8">

<title>Game Plans</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#080808;min-height:100vh;color:#e5e5e5;font-family:-apple-system,'Segoe UI',Arial,sans-serif;}
body{padding:12px 10px 60px;background:#080808;}
.hdr{background:linear-gradient(135deg,#0a1628,#0f2040);border-radius:12px;padding:14px 16px;margin-bottom:12px;text-align:center;border:1px solid #38bdf822;}
.hdr-title{font-size:16px;font-weight:900;color:#38bdf8;}
.hdr-sub{font-size:9px;color:#475569;letter-spacing:2px;margin-top:4px;}
.floor-banner{background:#1a0f28;border:2px solid #a855f7;border-radius:10px;padding:12px 14px;margin-bottom:10px;}
.floor-title{font-size:10px;font-weight:900;color:#a855f7;letter-spacing:2px;margin-bottom:8px;}
.floor-items{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.floor-item{background:#a855f711;border:1px solid #a855f733;border-radius:6px;padding:7px 10px;}
.floor-item-title{font-size:10px;font-weight:800;color:#c4b5fd;margin-bottom:2px;}
.floor-item-body{font-size:9px;color:#7c3aed;line-height:1.4;}
.rep-card{background:#0d0d0d;border:1px solid #1a1a1a;border-radius:10px;margin-bottom:8px;overflow:hidden;}
.rep-hdr{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;}
.rep-name{font-size:15px;font-weight:900;color:#fff;}
.rep-shift{font-size:9px;letter-spacing:1px;margin-top:1px;}
.rep-right{text-align:right;}
.prev-label{font-size:8px;color:#475569;letter-spacing:1px;}
.prev-val{font-size:13px;font-weight:900;}
.multi-bar{padding:8px 14px;border-top:1px solid #1a1a1a;background:#10080a;display:flex;align-items:center;gap:10px;}
.multi-label{font-size:9px;font-weight:800;color:#a855f7;letter-spacing:1px;white-space:nowrap;}
.multi-track{flex:1;background:#1a1a1a;border-radius:20px;height:8px;overflow:hidden;position:relative;}
.multi-fill{height:100%;border-radius:20px;}
.multi-goal-line{position:absolute;top:0;bottom:0;width:2px;left:52%;background:rgba(255,255,255,0.2);}
.multi-val{font-size:12px;font-weight:900;white-space:nowrap;}
.focus-strip{padding:8px 14px;border-top:1px solid #1a1a1a;display:flex;gap:8px;align-items:flex-start;}
.focus-label{font-size:9px;font-weight:800;color:#fbbf24;letter-spacing:1px;margin-bottom:2px;}
.focus-text{font-size:10px;color:#d97706;line-height:1.5;}
.cs-section{padding:8px 14px 10px;}
.cs-label{font-size:8px;font-weight:800;color:#38bdf8;letter-spacing:2px;margin-bottom:6px;}
.cs-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
.cs-item{background:#111;border:1px solid #1a1a1a;border-radius:6px;padding:5px 8px;}
.cs-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;}
.cs-name{font-size:9px;color:#64748b;font-weight:600;}
.cs-tier{font-size:8px;font-weight:900;padding:1px 5px;border-radius:4px;}
.cs-bottom{display:flex;justify-content:space-between;}
.cs-need{font-size:9px;color:#475569;}
.cs-pts{font-size:9px;font-weight:800;color:#22c55e;}
.bl{background:#111;color:#555;border:1px solid #222;}
.t1{background:#2a0a0a;color:#ef4444;}
.t2{background:#2a1400;color:#f97316;}
.t3{background:#252000;color:#eab308;}
.t4{background:#1a2400;color:#84cc16;}
.t5{background:#0d2a14;color:#22c55e;}
.peak{background:#0a2040;color:#38bdf8;}
.loading{text-align:center;padding:40px;color:#475569;font-size:13px;}
</style>
</head>

function getTierIdx(key,val){
  if(val==null)return 7;
  const t=CS_TIERS[key]||[];
  for(let i=0;i<t.length;i++){if(t[i][0]!==null&&val>=t[i][0])return i;}
  return 7;
}
function getNext(key,val,cur){
  const t=CS_TIERS[key]||[];
  for(let i=cur-1;i>=0;i--){
    if(t[i][0]!==null)return{tier:TIER_NAMES[i],gap:(t[i][0]-val).toFixed(1),pts:t[i][1]-(cur<7?t[cur][1]:0)};
  }
  return null;
}
function getMay(name){return MAY_DATA.find(r=>r.name===name)||null;}
function countGoal(may){
  if(!may)return'—';
  let n=0;
  ['vmp','premium','vhi','perks','smartquote','multi'].forEach(k=>{if((may[k]||0)>=GOALS[k])n++;});
  return n+'/6';
}
function getFocus(name,may,cs,multi){
  if(!may)return'No May data. Focus on VMP on every device, lead with the second phone, SmartQ on every smartphone.';
  const vmpLow=may.vmp<MINS.vmp,multiLow=(multi||0)<MINS.multi,sqLow=may.smartquote<MINS.smartquote;
  const newActs=cs&&cs.new_act||0;
  const atGoal=parseInt(countGoal(may))||0;
  if(vmpLow&&multiLow)return`VMP at ${may.vmp.toFixed(0)}% and multi at ${(multi||0).toFixed(0)}% in May — both below minimum. Quote VMP in FIRST before starting the transaction. Lead with the second phone before the customer commits to one device.`;
  if(vmpLow)return`VMP was ${may.vmp.toFixed(0)}% in May — below minimum. Quote it in before the transaction starts, not at the end. Check every account for unprotected lines.`;
  if(multiLow&&(multi||0)===0)return`Multi at 0% — the second phone conversation isn't happening. Lead with it before the customer picks a device. One duo moves New Act, Incremental, Base VAPs and iVAPs simultaneously.`;
  if(multiLow)return`Multi at ${(multi||0).toFixed(0)}% — below goal. Lead with the second phone before the customer commits to one device.`;
  if(sqLow&&may.smartquote>0)return`SmartQ at ${may.smartquote.toFixed(0)}% in May — needs to be on every smartphone today. Check every account for the blue banner on VZW Internet.`;
  if(atGoal>=4)return`${atGoal}/6 at goal in May — strong month. Keep the same habits today. Check every account for the blue banner and lead with the duo conversation.`;
  if(newActs===0)return`Nothing on the board yet for June — get your first transaction going. Check every account address for the blue banner.`;
  return`${newActs} new act${newActs===1?'':'s'} on the board. Keep building — lead with the second phone, check every account for the blue banner, and use SmartQ on every smartphone.`;
}

  const roster=repsParam?repsParam.split(',').filter(Boolean):[];

  if(!store||!roster.length){
    document.getElementById('output').innerHTML='<div class="loading">No game plan data found. Ask your manager for the correct link.</div>';
    return;
  }

  const sc=STORE_COLORS[store]||'#38bdf8';
  const d=dateStr?new Date(dateStr+'T12:00:00'):new Date();
  const dateLabel=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}).toUpperCase();
  document.getElementById('hdr-sub').textContent=store.toUpperCase()+' · '+dateLabel;

  let html=`<div class="floor-banner">
    <div class="floor-title">🏪 STORE PRIORITIES TODAY</div>
    <div class="floor-items">
      <div class="floor-item"><div class="floor-item-title">🔥 MULTI FIRST</div><div class="floor-item-body">Lead with the second phone before the customer commits. A duo moves 4 CScore metrics at once.</div></div>
      <div class="floor-item"><div class="floor-item-title">📱 SMARTQ EVERY TIME</div><div class="floor-item-body">SmartQ on every smartphone — no exceptions today.</div></div>
      <div class="floor-item"><div class="floor-item-title">🏠 BLUE BANNER CHECK</div><div class="floor-item-body">Verify address in every account. Look for the blue banner. If it's there, say it out loud.</div></div>
      <div class="floor-item"><div class="floor-item-title">🤝 HUDDLE UP</div><div class="floor-item-body">Work as a team on every customer. Better workflow creates bigger sales.</div></div>
    </div>
  </div>`;

  roster.forEach(name=>{
    const may=getMay(name);
    const cs=JUN_RC_DATA[name]||null;
    const multi=JUN_MULTI_DATA[name]??null;
    const atGoal=countGoal(may);
    const atGoalNum=parseInt(atGoal)||0;
    const gc=atGoalNum>=4?'#22c55e':atGoalNum>=2?'#eab308':'#ef4444';
    const mc=multi===null?'#555':multi>=52?'#22c55e':multi>=48?'#eab308':'#ef4444';
    const mf=multi===null?0:Math.min(100,multi);
    const focus=getFocus(name,may,cs,multi);
    const icon=atGoalNum>=4?'⭐':(!multi||multi===0)?'🔥':'⚡';
    const csRows=CS_KEYS.map(key=>{
      const val=cs?(cs[key]||0):0;
      const ti=getTierIdx(key,val);
      const nt=getNext(key,val,ti);
      const disp=val%1===0?val:val.toFixed(1);
      return`<div class="cs-item"><div class="cs-top"><span class="cs-name">${CS_LABELS[key]} (${disp})</span><span class="cs-tier ${TIER_CSS[Math.min(ti,7)]}">${TIER_NAMES[Math.min(ti,7)]}</span></div><div class="cs-bottom"><span class="cs-need">${nt?'+'+nt.gap+' for '+nt.tier:'✓ MAX'}</span><span class="cs-pts">${nt?'+'+nt.pts+'pts':''}</span></div></div>`;
    }).join('');

    html+=`<div class="rep-card">
      <div class="rep-hdr" style="background:linear-gradient(135deg,#0a0a0a,#111);border-bottom:2px solid ${sc}44;">
        <div><div class="rep-name">${name}</div><div class="rep-shift" style="color:${sc}88;">${store} · ${d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</div></div>
        <div class="rep-right"><div class="prev-label">MAY AT GOAL</div><div class="prev-val" style="color:${gc}">${may?atGoal:'—'}</div></div>
      </div>
      <div class="multi-bar">
        <span class="multi-label">MULTI%</span>
        <div class="multi-track"><div class="multi-fill" style="width:${mf}%;background:${mc};"></div><div class="multi-goal-line"></div></div>
        <span class="multi-val" style="color:${mc}">${multi!==null?multi.toFixed(1)+'%':'—'}</span>
      </div>
      <div class="focus-strip">
        <div style="font-size:16px;flex-shrink:0;margin-top:1px;">${icon}</div>
        <div><div class="focus-label">TODAY'S FOCUS</div><div class="focus-text">${focus}</div></div>
      </div>
      <div class="cs-section">
        <div class="cs-label">JUNE C·SCORE</div>
        <div class="cs-grid">${csRows}</div>
      </div>
    </div>`;
  });

  document.getElementById('output').innerHTML=html;
};
</script>
</body>
</html>
